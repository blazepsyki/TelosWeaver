<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Harness Web Dashboard</title>
    <style>
        body { font-family: monospace; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; margin: 0; padding: 10px; background: #1e1e1e; color: #fff; }
        #header { padding: 10px; border: 1px solid gray; margin-bottom: 10px; font-weight: bold; }
        #logs { flex: 1; border: 1px solid gray; overflow-y: auto; padding: 10px; font-size: 14px; background: #000; }
        #controls { padding: 10px; border: 1px solid gray; margin-top: 10px; text-align: center; }
        .log-entry { border-bottom: 1px solid #222; padding: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .log-entry:last-child { border-bottom: 0; }
        .log-meta { color: #aaa; margin-bottom: 4px; }
        .log-tool { color: #8fd; font-weight: bold; }
        .log-step { color: #ccc; }
        .log-text { color: inherit; }
        .log-error { color: #f55; }
        .log-warn { color: #ff5; }
        .log-info { color: #fff; }
        .log-debug { color: #888; }
        .status-running { color: #5f5; }
        .status-error { color: #ff5; }
        .status-paused { color: #f55; }
        .status-idle { color: #888; }
        button { padding: 5px 15px; margin: 0 5px; font-family: inherit; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header">Loading...</div>
    <div id="logs"></div>
    <div id="controls">
        <div id="statusMsg">작업 진행 중...</div>
        <div id="actions" style="display: none;">
            <p>Intervention Required</p>
            <button onclick="sendCommand('proceed')">Proceed (진행)</button>
            <button onclick="promptModify()">Modify (수정)</button>
            <button onclick="sendCommand('abort')">Abort (중단)</button>
        </div>
    </div>

    <script>
        const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
        let ws;

        function connect() {
            ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'state_init') {
                    renderState(data.data);
                } else if (data.type === 'log_history') {
                    renderLogHistory(data.data);
                } else if (data.type === 'log') {
                    appendLog(data.data);
                } else if (data.type === 'state_update') {
                    renderState(data.data);
                }
            };
            ws.onclose = () => {
                setTimeout(connect, 2000);
            };
        }

        // Need initial polling for state if ws doesn't push pure state updates except on connect.
        setInterval(() => {
            fetch('/api/state').then(res => res.json()).then(renderState);
        }, 1000);

        function renderState(state) {
            let colorCls = 'status-idle';
            if (state.status === 'running') colorCls = 'status-running';
            else if (state.status === 'error_recovering') colorCls = 'status-error';
            else if (state.status === 'paused_for_intervention') colorCls = 'status-paused';

            const activeTools = Object.values(state.active_tools || {}).map(at => at.tool_id).sort().join(', ');
            document.getElementById('header').innerHTML = `<span class="${colorCls}">[Status: ${state.status}]</span> | Active Tools: ${activeTools || 'None'} | Step: ${state.current_step || 'None'}`;

            if (state.status === 'paused_for_intervention') {
                document.getElementById('statusMsg').style.display = 'none';
                document.getElementById('actions').style.display = 'block';
            } else {
                document.getElementById('statusMsg').style.display = 'block';
                document.getElementById('statusMsg').innerText = "작업 진행 중...";
                document.getElementById('actions').style.display = 'none';
            }
        }

        function appendLog(msg) {
            const div = document.createElement('div');
            const time = new Date(msg.timestamp).toLocaleTimeString();
            let cls = 'log-info';
            if (msg.level === 'error') cls = 'log-error';
            else if (msg.level === 'warn') cls = 'log-warn';
            else if (msg.level === 'debug') cls = 'log-debug';

            div.className = `log-entry ${cls}`;
            const meta = document.createElement('div');
            meta.className = 'log-meta';

            const tool = document.createElement('span');
            tool.className = 'log-tool';
            tool.textContent = msg.tool_id || 'unknown-tool';

            const step = document.createElement('span');
            step.className = 'log-step';
            step.textContent = msg.step_id ? ` step=${msg.step_id}` : '';

            meta.append(`[${time}] [${msg.level}] [`);
            meta.appendChild(tool);
            meta.append(`] [${msg.source}]`);
            meta.appendChild(step);

            const text = document.createElement('div');
            text.className = 'log-text';
            text.textContent = msg.text || '';

            div.appendChild(meta);
            div.appendChild(text);
            const logs = document.getElementById('logs');
            const stickToBottom = logs.scrollTop + logs.clientHeight >= logs.scrollHeight - 8;
            logs.appendChild(div);
            if (stickToBottom) {
                logs.scrollTop = logs.scrollHeight;
            }
        }

        function renderLogHistory(messages) {
            const logs = document.getElementById('logs');
            logs.replaceChildren();
            for (const msg of messages) {
                appendLog(msg);
            }
            logs.scrollTop = logs.scrollHeight;
        }

        function sendCommand(action, feedback = null) {
            ws.send(JSON.stringify({ action, feedback }));
        }

        function promptModify() {
            const feedback = prompt("수정할 내용을 입력하세요:");
            if (feedback !== null) {
                sendCommand('modify', feedback);
            }
        }

        connect();
    </script>
</body>
</html>
