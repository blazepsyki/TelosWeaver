[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# 모든 의존성 버전은 여기서만 정합니다. 추가·변경은 PH0-INTEGRATION에 요청합니다 (Spec §19.5.4-1).
[workspace.dependencies]
telos-schema = { path = "crates/schema" }
telos-adapters = { path = "crates/adapters" }
telos-rn-client = { path = "crates/rn-client" }

async-trait = "0.1.92"
futures = "0.3.34"
getrandom = "0.4.3"
libc = "0.2.190"
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = "1.54.1"
windows-sys = "0.61.2"
