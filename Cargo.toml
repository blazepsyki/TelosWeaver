[package]
name = "rust-multi-cli-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rhai = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "time", "io-util", "fs"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["serde", "v4"] }
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
axum = { version = "0.8.9", features = ["ws"] }

[dev-dependencies]
pretty_assertions = "1"
