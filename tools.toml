version = 1

[supervisor]
command = "codex"
args = [
    "exec",
    "--sandbox",
    "read-only",
    "--json",
    """
You are the supervisor for a multi-CLI worker harness.

Read .harness_context.json in the current working directory. It contains the user prompt in state.context_log and the available worker_tools.

Your job is only to plan and route work. Do not solve the user's task yourself.

Return exactly one JSON object and no prose. Use this schema:
{
  "is_done": false,
  "summary": "brief routing summary",
  "actions": [
    {
      "task_id": "short-stable-task-id",
      "tool_id": "one of the worker_tools ids",
      "args": [],
      "prompt": "the specific worker prompt"
    }
  ]
}

If the current context already contains enough worker output to answer or stop, return:
{
  "is_done": true,
  "summary": "why the orchestration is complete",
  "actions": []
}

Prefer multiple actions when the user task can be usefully split across available worker tools.
"""
]
working_dir = "."

[supervisor.parser]
entrypoint = "decide"
script = '''
#{
    "summary": stdout_text
}
'''

[[tools]]
id = "antigravity-cli"
name = "Antigravity CLI"
command = "agy"
args = ["-p"]
working_dir = "."

[tools.parser]
entrypoint = "parse"
script = '''
let level = if exit_code != 0 {
    "error"
} else {
    "info"
};

let raw = if stdout_text.len() > 0 {
    stdout_text
} else {
    stderr_text
};

#{
    "tool_id": tool_id,
    "source": if exit_code != 0 && stderr_text.len() > 0 { "stderr" } else { "stdout" },
    "kind": "assistant",
    "level": level,
    "step_id": step_id,
    "correlation_id": correlation_id,
    "raw_output": raw,
    "normalized_payload": #{
        "exit_code": exit_code,
        "stdout_text": stdout_text,
        "stderr_text": stderr_text
    },
    "truncated": false
}
'''

[[tools]]
id = "codex-cli"
name = "Codex CLI"
command = "codex"
args = ["exec", "--sandbox", "read-only", "--json"]
working_dir = "."

[tools.parser]
entrypoint = "parse"
script = '''
let level = if exit_code != 0 {
    "error"
} else {
    "info"
};

let raw = if stdout_text.len() > 0 {
    stdout_text
} else {
    stderr_text
};

#{
    "tool_id": tool_id,
    "source": if exit_code != 0 && stderr_text.len() > 0 { "stderr" } else { "stdout" },
    "kind": "assistant",
    "level": level,
    "step_id": step_id,
    "correlation_id": correlation_id,
    "raw_output": raw,
    "normalized_payload": #{
        "exit_code": exit_code,
        "stdout_text": stdout_text,
        "stderr_text": stderr_text
    },
    "truncated": false
}
'''

[[tools]]
id = "copilot-cli"
name = "Copilot CLI"
command = "copilot"
args = ["--output-format", "json", "--allow-all-tools", "-p"]
working_dir = "."

[tools.parser]
entrypoint = "parse"
script = '''
let level = if exit_code != 0 {
    "error"
} else {
    "info"
};

let raw = if stdout_text.len() > 0 {
    stdout_text
} else {
    stderr_text
};

#{
    "tool_id": tool_id,
    "source": if exit_code != 0 && stderr_text.len() > 0 { "stderr" } else { "stdout" },
    "kind": "assistant",
    "level": level,
    "step_id": step_id,
    "correlation_id": correlation_id,
    "raw_output": raw,
    "normalized_payload": #{
        "exit_code": exit_code,
        "stdout_text": stdout_text,
        "stderr_text": stderr_text
    },
    "truncated": false
}
'''
