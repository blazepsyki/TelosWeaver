[package]
description = "Reason Network Fork Local RPC 클라이언트 (Spec §12)"
name = "telos-rn-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
telos-schema.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt", "macros", "rt-multi-thread"] }
